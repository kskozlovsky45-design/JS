<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f2f4f8; }
        .calc { width: 280px; margin: 0 auto; border: 1px solid #aaa; border-radius: 28px; padding: 15px; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #display { width: 100%; padding: 12px; font-size: 28px; font-family: 'Courier New', monospace; text-align: right; margin-bottom: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 20px; background: #fefefe; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 5px; }
        button { width: 100%; padding: 12px; font-size: 20px; cursor: pointer; border: none; border-radius: 40px; background: #e0e0e0; transition: 0.05s linear; }
        button:active { transform: scale(0.96); background: #ccc; }
        button.operator { background: #ffb347; color: #2c2c2c; font-weight: bold; }
        button.equals { background: #4caf50; color: white; }
        button.clear { background: #ff6b6b; color: white; }
        .history { margin-top: 18px; border-top: 1px solid #ddd; padding-top: 8px; max-height: 130px; overflow-y: auto; font-family: monospace; font-size: 13px; }
        .history strong { font-family: Arial; font-size: 12px; }
        .history div { padding: 4px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
<div class="calc">
    <input type="text" id="display" readonly value="0">
    <table>
        <tr><td><button class="digit">7</button></td><td><button class="digit">8</button></td><td><button class="digit">9</button></td><td><button class="operator">/</button></td></tr>
        <tr><td><button class="digit">4</button></td><td><button class="digit">5</button></td><td><button class="digit">6</button></td><td><button class="operator">*</button></td></tr>
        <tr><td><button class="digit">1</button></td><td><button class="digit">2</button></td><td><button class="digit">3</button></td><td><button class="operator">-</button></td></tr>
        <tr><td><button class="digit">0</button></td><td><button class="clear">C</button></td><td><button class="equals">=</button></td><td><button class="operator">+</button></td></tr>
    </table>
    <div class="history">
        <strong>История:</strong>
        <div id="historyBox"></div>
    </div>
</div>
<script src="calculator.js"></script>
</body>
</html>
